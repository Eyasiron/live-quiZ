<title>LIVE QUIZ - مسابقات اللايف</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#090b12;
    color:white;
}

.app{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.header{
    background:linear-gradient(135deg,#171b2d,#10121c);
    border:1px solid #292e43;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
}

.header h1{
    margin:0 0 6px;
    font-size:30px;
}

.header p{
    margin:0;
    color:#aeb5c8;
}

.status{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.badge{
    background:#1b2031;
    padding:8px 12px;
    border-radius:20px;
    color:#dce1f0;
}

.live{
    background:#c62828;
}

.section{
    background:#111521;
    border:1px solid #252b3c;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
}

.section h2{
    margin-top:0;
}

.modes{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.mode{
    border:1px solid #30374d;
    background:#181d2a;
    color:white;
    padding:15px;
    border-radius:15px;
    cursor:pointer;
    font-size:16px;
    text-align:right;
}

.mode:hover{
    background:#232a3d;
}

.mode.active{
    border-color:#7c5cff;
    background:#27213e;
}

textarea,input{
    width:100%;
    background:#090c14;
    border:1px solid #30374d;
    color:white;
    border-radius:12px;
    padding:12px;
    font-size:16px;
    outline:none;
}

input{
    margin-bottom:10px;
}

button{
    border:0;
    border-radius:12px;
    padding:12px 16px;
    cursor:pointer;
    color:white;
    background:#5d43d6;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.question{
    font-size:25px;
    line-height:1.6;
    font-weight:bold;
    background:#191e2b;
    border-radius:15px;
    padding:18px;
    margin:12px 0;
}

.answer{
    color:#62e6a5;
    font-size:20px;
    font-weight:bold;
}

.comments{
    max-height:330px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.comment{
    background:#181d28;
    border-radius:12px;
    padding:10px;
    border-right:4px solid #343b51;
}

.comment.correct{
    border-right-color:#39d98a;
    background:#12271f;
}

.username{
    font-weight:bold;
    color:#a98cff;
}

.winner{
    display:none;
    background:linear-gradient(135deg,#183d2b,#10231b);
    border:1px solid #36d58a;
    border-radius:18px;
    padding:20px;
    text-align:center;
    margin-top:12px;
}

.winner.show{
    display:block;
}

.winner-title{
    font-size:17px;
    color:#9eeac5;
}

.winner-name{
    font-size:30px;
    font-weight:bold;
    margin-top:7px;
}

.points{
    color:#ffd76a;
    font-weight:bold;
}

.small{
    color:#9ba4ba;
    font-size:14px;
}

.library{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    flex:1;
    min-width:130px;
    background:#181d2a;
    padding:15px;
    border-radius:14px;
}

.stat strong{
    display:block;
    font-size:25px;
    margin-top:5px;
}

@media(max-width:600px){
    .app{
        padding:10px;
    }

    .modes{
        grid-template-columns:1fr;
    }

    .question{
        font-size:21px;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🏆 LIVE QUIZ</h1>
        <p>لوحة مسابقات اللايف التجريبية</p>

    </div>

    <div class="section">
        <h2>🎮 اختر نوع المسابقة</h2>

        <div class="modes">

            <button class="mode active" onclick="selectMode('general',this)">

            </button>

            <button class="mode" onclick="selectMode('truefalse',this)">

            </button>

            <button class="mode" onclick="selectMode('riddle',this)">
                🧩 ألغاز
            </button>

            <button class="mode" onclick="selectMode('music',this)">
                🎵 احزر الأغنية
            </button>

            <button class="mode" onclick="selectMode('image',this)">

            </button>

        </div>
    </div>


    <div class="section">

        <h2>🎯 الجولة الحالية</h2>

        <div id="question" class="question">
            اضغط "جولة جديدة" لبدء المسابقة.
        </div>

        <div>
            <span class="small">الإجابة الصحيحة:</span>
            <div id="answer" class="answer">---</div>
        </div>

        <br>

        <div class="buttons">
            <button onclick="newRound()">🎲 جولة جديدة</button>
            <button onclick="showAnswer()">👁️ إظهار الإجابة</button>
            <button onclick="resetWinner()">🔄 تصفير الفائز</button>
        </div>

    </div>


    <div class="section">

        <h2>💬 تعليقات المشاهدين</h2>

        <input id="username" placeholder="اسم المتابع التجريبي">

        <input id="commentInput" placeholder="اكتب تعليق المتابع هنا">

        <div class="buttons">
            <button onclick="addComment()">💬 إضافة تعليق</button>
            <button onclick="simulateComments()">🤖 تجربة تعليقات تلقائية</button>
            <button onclick="clearComments()">🗑️ مسح التعليقات</button>
        </div>

        <br>

        <div id="comments" class="comments"></div>

        <div id="winner" class="winner">

            <div id="winnerName" class="winner-name"></div>
            <div class="points">+1 نقطة</div>
        </div>

    </div>


    <div class="section">

            </div>

            </div>

</div>

/* ---------------------------------------------------------
   توليد آلاف الجولات من قاعدة المعلومات
--------------------------------------------------------- */

function expandDatabase(){

    const categories = Object.keys(questions);

    categories.forEach(category=>{

        const original = [...questions[category]];

        /*
          نكرر الأسئلة كجولات مختلفة.
          لاحقًا يمكن استبدال هذا الجزء بقاعدة بيانات
          ضخمة حقيقية تحتوي على آلاف الأسئلة.
        */

        for(let round=1; round<=80; round++){

            original.forEach((item,index)=>{

                let copy = {
                    q:item.q,
                    a:item.a
                };

                questions[category].push(copy);

            });

        }

    });
}

/* ---------------------------------------------------------
   المتغيرات
--------------------------------------------------------- */

let currentMode="general";
let currentQuestion=null;
let round=0;
let commentsCount=0;
let winnerCount=0;
let winnerLocked=false;


/* ---------------------------------------------------------
   تطبيع الإجابات
--------------------------------------------------------- */

function normalize(text){

    return String(text)
        .toLowerCase()
        .trim()
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/[أإآ]/g,"ا")
        .replace(/ة/g,"ه")
        .replace(/ى/g,"ي")
        .replace(/[.,!?؟،]/g,"")
        .replace(/\s+/g," ");

}


/* ---------------------------------------------------------
   اختيار نوع المسابقة
--------------------------------------------------------- */

function selectMode(mode,button){

    currentMode=mode;

    document.querySelectorAll(".mode").forEach(b=>{
        b.classList.remove("active");
    });

    button.classList.add("active");

    newRound();
}


/* ---------------------------------------------------------
   جولة جديدة
--------------------------------------------------------- */

function newRound(){

    winnerLocked=false;

    document.getElementById("winner").classList.remove("show");

    const bank=questions[currentMode];

    const index=Math.floor(Math.random()*bank.length);

    currentQuestion=bank[index];

    round++;

    document.getElementById("roundNumber").textContent=round;

    document.getElementById("question").textContent=currentQuestion.q;

    document.getElementById("answer").textContent="مخفية";

}


/* ---------------------------------------------------------
   إظهار الإجابة
--------------------------------------------------------- */

function showAnswer(){

    if(!currentQuestion){
        alert("ابدأ جولة أولًا.");
        return;
    }

    document.getElementById("answer").textContent=currentQuestion.a;

}


/* ---------------------------------------------------------
   التحقق من الإجابة
--------------------------------------------------------- */

function isCorrect(comment){

    if(!currentQuestion) return false;

    const user=normalize(comment);

    const answer=normalize(currentQuestion.a);

    if(!user || !answer) return false;

    if(user===answer) return true;

    if(answer==="صح" && ["صح","صحيح","yes","true"].includes(user))
        return true;

    if(answer==="غلط" && ["غلط","خطا","خطأ","false","no"].includes(user))
        return true;

    /*
      إذا كانت الإجابة تحتوي عدة كلمات،
      نعتبر التعليق صحيحًا إذا احتوى الإجابة الأساسية.
    */

    if(answer.length>=4 && user.includes(answer))
        return true;

    return false;
}


/* ---------------------------------------------------------
   إضافة تعليق
--------------------------------------------------------- */

function addComment(){

    const username=document.getElementById("username").value.trim();
    const comment=document.getElementById("commentInput").value.trim();

    if(!username || !comment){
        alert("اكتب اسم المتابع والتعليق.");
        return;
    }

    processComment(username,comment);

    document.getElementById("commentInput").value="";
}


/* ---------------------------------------------------------
   معالجة التعليق
--------------------------------------------------------- */

function processComment(username,comment){

    commentsCount++;

    document.getElementById("commentCount").textContent=commentsCount;

    const box=document.getElementById("comments");

    const div=document.createElement("div");

    div.className="comment";

    div.innerHTML=
        '<span class="username">@'+escapeHTML(username)+'</span> : '+
        escapeHTML(comment);

    box.appendChild(div);

    const correct=isCorrect(comment);

    if(correct){

        div.classList.add("correct");

        /*
          أهم جزء:
          أول إجابة صحيحة فقط هي التي تصبح الفائز.
        */

        if(!winnerLocked){

            winnerLocked=true;

            winnerCount++;

            document.getElementById("winnerTotal").textContent=winnerCount;

            document.getElementById("winnerName").textContent="@"+username;

            document.getElementById("winner").classList.add("show");

        }

    }

    box.scrollTop=box.scrollHeight;

}

                ];

            }

            processComment(
                fakeUsers[
                    Math.floor(Math.random()*fakeUsers.length)
                ],
                answer
            );

        },delay);

}

function clearComments(){

    document.getElementById("comments").innerHTML="";

}


/* ---------------------------------------------------------
   حماية النصوص
--------------------------------------------------------- */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
